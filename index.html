<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meowditation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f14;
      color: #e8e8ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .emoji { font-size: 72px; margin-bottom: 24px; }
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #7fffd4, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    p {
      color: rgba(255,255,255,0.55);
      font-size: 1rem;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    a {
      color: #7fffd4;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 10px 22px;
      border: 1px solid rgba(127,255,212,0.3);
      border-radius: 50px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(127,255,212,0.08); }
  </style>
</head>
<body>
  <div class="emoji">🐱</div>
  <h1>Meowditation</h1>
  <p>A cozy meditation companion on iOS. Breathe, grow, and relax with your cat.</p>
  <div class="links">
    <a href="/meditationcat/privacy">Privacy Policy</a>
    <a href="/meditationcat/terms">Terms of Service</a>
  </div>
</body>
</html>
